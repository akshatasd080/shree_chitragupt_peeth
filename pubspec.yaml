name: shree_chitragupt_peeth
description: "Shree Chitragupt Peeth Official App"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.7
  firebase_messaging: ^15.1.3

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.7

  # UI
  cached_network_image: ^3.4.1
  youtube_player_flutter: ^9.1.3
  youtube_explode_dart: ^2.3.6
  flutter_screenutil: ^5.9.3
  flutter_animate: ^4.5.2
  google_fonts: ^6.2.1
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  razorpay_flutter: ^1.4.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.2
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0

  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

# ---------------- SPLASH SCREEN ---------------- #

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo.jpeg

  android: true
  ios: true
  web: false

  fullscreen: true

  android_12:
    color: "#FFFFFF"
    image: assets/images/logo.jpeg

# ---------------- APP ICON ---------------- #

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/logo.jpeg"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.jpeg"

  remove_alpha_ios: true